; Diagnostics never reach the visitor; they always reach the operator.
;
; php.ini-production already sets these, but they are the one setting whose
; silent regression leaks filesystem paths into public HTML, so they are
; pinned explicitly here rather than inherited. Loaded from conf.d as zz-*
; so it wins over anything earlier in the directory.
display_errors = Off
display_startup_errors = Off
log_errors = On

; error_log is deliberately NOT set. Setting it makes PHP prefix every
; error_log() call with "[date] ", which would corrupt the single-line JSON
; that Support\OperationalLog writes through that same function. Left unset,
; diagnostics go to the SAPI's own error stream: php-fpm's global
; error_log = /proc/self/fd/2 (with catch_workers_output = yes,
; decorate_workers_output = no) for the deployed image, and stderr under the
; CLI server. Both reach the container log, and app JSON lines stay parseable.
